#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
# Máy Windows có proxy/CA riêng: đặt systemProp.javax.net.ssl.trustStoreType=WINDOWS-ROOT trong %USERPROFILE%\.gradle\gradle.properties, không đặt trong file dự án.
# Artifact downloads are slow on this environment.
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000
android.nonTransitiveRClass=true
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
